<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>وبلاگ | پایشگران</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .blog-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .blog-post {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .blog-post img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .blog-content {
            padding: 30px;
        }

        .blog-content h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .blog-content p {
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <main class="blog-container">

        <article class="blog-post">

            <!-- عکس مقاله -->
            <img src="blogimage.png" alt="تصویر مقاله">

            <!-- متن مقاله -->
            <div class="blog-content">

                <h1>عنوان مقاله شما</h1>

                <p>
                    اینجا متن مقاله شما قرار می‌گیرد.
                    می‌توانید هر مقدار متن که می‌خواهید در این قسمت بنویسید.
                </p>

                <p>
                    این بخش برای نوشتن محتوای کامل مقاله است و می‌توانید
                    پاراگراف‌های مختلف، تیترها و اطلاعات مفید اضافه کنید.
                </p>

            </div>

        </article>

    </main>

</body>
</html>
